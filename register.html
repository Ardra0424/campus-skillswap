<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style> *{font-family: sans-serif} </style></head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
<h2 class="text-2xl font-bold mb-1">Sign Up</h2><p class="text-gray-500 mb-6">It's quick and easy.</p>
<input id="name" placeholder="Full Name" class="w-full p-3 border rounded-lg mb-3">
<input id="email" placeholder="Email" class="w-full p-3 border rounded-lg mb-3">
<input id="dept" placeholder="Department (BCA, MCA)" class="w-full p-3 border rounded-lg mb-3">
<input id="phone" placeholder="Phone" class="w-full p-3 border rounded-lg mb-3">
<input id="password" type="password" placeholder="New Password" class="w-full p-3 border rounded-lg mb-4">
<button onclick="register()" class="w-full bg-[#42b72a] text-white py-3 rounded-lg font-bold text-lg">Sign Up</button>
<p id="msg" class="text-center mt-3 text-sm"></p>
<p class="text-center mt-4"><a href="index.html" class="text-indigo-600">Already have account? Login</a></p>
</div>
<script>
async function register(){
  const body = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    dept: document.getElementById('dept').value,
    phone: document.getElementById('phone').value,
    password: document.getElementById('password').value
  };
  if(!body.name || !body.email || !body.password){ document.getElementById('msg').innerText='Fill all fields'; return; }
  document.getElementById('msg').innerText='Creating...';
  try{
    const res = await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await res.json();
    document.getElementById('msg').innerText = 'Account Created! Redirecting...';
    setTimeout(()=>location.href='index.html',1000);
  }catch(e){
    document.getElementById('msg').innerText = 'Error: '+e.message;
  }
}
</script>
</body></html>
