<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillSwap - Login</title>
<style>{font-family: sans-serif}</style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f2f5] min-h-screen">
<div class="min-h-screen flex items-center justify-center p-4">
<div class="max-w-6xl w-full grid md:grid-cols-2 gap-12 items-center">
<div class="hidden md:block">
<h1 class="text-6xl font-extrabold text-indigo-600">SkillSwap</h1>
<p class="text-2xl mt-4 text-gray-700">Connect with peer tutors in your campus.<br>Share skills, learn together, grow faster.</p>
<div class="mt-8 flex gap-4 text-gray-600">
<span><i class="fa-solid fa-check-circle text-green-500"></i> Real-time Chat</span>
<span><i class="fa-solid fa-check-circle text-green-500"></i> Smart Matching</span>
</div>
</div>
<div class="bg-white rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.12)] p-8 w-full max-w-[400px] mx-auto">
<h2 class="text-2xl font-bold text-center md:hidden text-indigo-600 mb-6">SkillSwap</h2>
<input id="email" placeholder="Email" class="w-full p-3.5 border rounded-lg mb-3 focus:outline-none focus:border-indigo-500">
<input id="password" type="password" placeholder="Password" class="w-full p-3.5 border rounded-lg mb-3 focus:outline-none">
<button onclick="login()" class="w-full bg-[#1877f2] text-white py-3 rounded-lg font-bold text-lg hover:bg-[#166fe5]">Log in</button>
<p id="msg" class="text-center mt-3 text-sm text-gray-600"></p>
<p class="text-center mt-3 text-sm"><a href="#" class="text-[#1877f2]">Forgotten password?</a></p>
<hr class="my-5">
<div class="text-center">
<a href="register.html" class="inline-block bg-[#42b72a] text-white px-6 py-3 rounded-lg font-bold">Create new account</a>
</div>
<p class="text-center text-sm mt-6"><b>Create a Page</b> for peer learning club.</p>
</div>
</div>
</div>
<script>
async function login(){
 const email = document.getElementById('email').value;
 const password = document.getElementById('password').value;
 const msg = document.getElementById('msg');
 if(!email || !password){ msg.innerText='Fill email and password'; return; }
 msg.innerText='Checking... Please wait 30 sec (server waking up)';
 try{
  const res = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d = await res.json();
  msg.innerText = d.message || 'Success';
  if(res.ok){ setTimeout(()=> location.href='dashboard.html', 800); }
 }catch(e){
  msg.innerText='Server is waking up... wait 30 sec and try again';
 }
}
</script>
</body>
</html>
